; POLYBAR CONFIG
;--------------------------- COLORS ---------------------------
; ------ colors ------
[colors]

base0 = #2E3647
base1 = #3A4458
base2 = #5E6A83
base3 = #A0AECB
base4 = #D7E1F5
base5 = #F4F8FF
base6 = #9ADBFF
base7 = #FF79C2
base8 = #8FFFBC
base9 = #E8FFA6
base10 = #FF92AC
base11 = #FDAFFF
base12 = #94F2FF
base13 = #B7E1FF
base14 = #9CABDF
base15 = #9CA6FF

; ------ colors ------
;--------------------------- BARS -----------------------------

[bar/base]
monitor = ${env:MONITOR:}
font-0=Cozette:size=8:antialias=true;2
offset-y = 6
padding = 0
height = 27
background = ${colors.base0}
foreground = ${colors.base4}
override-redirect=false

;------------------------ LEFT HAND SIDE --------------------------

[bar/workspace]
enable-ipc = true
inherit = bar/base
width = 9%
offset-x = 0.6%
line-size = 2
modules-center = dwm-tags

;--------------------------------------

[bar/wired-network]
inherit = bar/base
width = 2%
offset-x = 10%
modules-center = wired-network

[bar/music]
inherit = bar/base
enable-ipc = true
width = 20%
offset-x = 40%
modules-center = spotify
monitor = DisplayPort-2

;--------------------------------------

[bar/pomodoro]
inherit = bar/base
enable-ipc = true
width = 4%

offset-x = 60.5%
modules-center = pomodoro

background = ${colors.base0}
foreground = ${colors.base4}
dim-value = 0.8

;--------------------------------------

[bar/timedate]
inherit = bar/base
width = 7%
offset-x = 92.5%
modules-right = time
modules-left = date
padding = 3

[bar/memory]
inherit = bar/base
width = 7%
offset-x = 85%
padding = 3
modules-left = memory
modules-right = cpu

;--------------------------- MODULES ---------------------------

[module/dwm-tags]
type = internal/dwm
format = <label-tags>

; focused = Selected tag on focused monitor
label-focused = ■
label-focused-underline = ${colors.base6}
label-focused-foreground = ${colors.base6}
label-focused-padding = 1

; unfocused = Unselected tag on unselected monitor
label-unfocused = ■
label-unfocused-foreground = ${colors.base2}
; label-visible-underline = ${colors.base2}
label-unfocused-padding = 1

; visible = Unselected tag, but occupied tag on any monitor
label-visible = ■
label-visible-foreground = ${colors.base2}
; label-visible-underline = ${colors.base2}
label-visible-padding = ${self.label-focused-padding}

; empty = Unselected and unoccupied tag
label-empty = □
label-empty-foreground = ${colors.base2}
label-empty-padding = 1

; urgent = Unselected tag with window that has urgency hint set
label-urgent = ■
label-urgent-foreground = ${colors.base10}
label-urgent-padding = 1

label-separator = " "

[module/time]
type = internal/date
interval = 10
format-margin = 0
time = "%H:%M"
label = %time%
label-foreground = ${colors.base8}

[module/date]
type = internal/date
interval = 1000
format-margin = 0
date = "%d %b"
label = %date%
label-foreground = ${colors.base3}

;--------------------------------------

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

format-charging = <label-charging> <animation-charging>
format-discharging = <label-discharging> <ramp-capacity>
format-full = <label-full> <ramp-capacity>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 

;--------------------------------------

[module/spotify]
type = custom/script
exec = playerctl -p spotify metadata --format '%{F#A0AECB}{{artist}} %{F#FF79C2}- %{F#D7E1F5}{{title}}'
exec-if = "pgrep spotify"
format-padding = 1
tail = true
interval = 1
click-left = playerctl play-pause -p spotify
click-right = playerctl next -p spotify
click-middle = playerctl previous -p spotify
;--------------------------------------

[module/pomodoro]
type = custom/script

exec = .scripts/polypomo
tail = true

label = %output%
click-left = .scripts/polypomo toggle
click-right = .scripts/polypomo end
click-middle = .scripts/polypomo lock
scroll-up = .scripts/polypomo time +60
scroll-down = .scripts/polypomo time -60

font-0 = Cozette:size=8:antialias=true;2
font-1 = Noto Emoji:scale=15:antialias=false;0
;--------------------------------------

[module/memory]
type = internal/memory
interval = 2
label = %{F#9ADBFF}%percentage_used%% %{F#5E6A83}MEM

[module/cpu]
type = internal/cpu
interval = 1
label = %{F#5E6A83}CPU %{F#FDAFFF}%percentage%%

[module/temperature]
type = internal/temperature
interval = 2
label = %temperature-c%

[module/wired-network]
type = internal/network
# label-connected = 󰒋
label-connected = "  "
# label-connected = %essid% %downspeed:9%
label-connected-foreground = ${colors.base8}
label-disconnected = ⌀
label-disconnected-foreground = ${colors.base7}
format-connected = <label-connected>
# format-packetloss = <animation-packetloss> <label-connected>
interface = enp4s0

[module/wireless-network]
type = internal/network
interface = wlan1
; Only applies if <ramp-signal> is used
ramp-signal-0 = 😱
ramp-signal-1 = 😠
ramp-signal-2 = 😒
ramp-signal-3 = 😊
ramp-signal-4 = 😃
ramp-signal-5 = 😈

;--------------------------- SETTINGS ---------------------------

[settings]
;screenchange-reload = true
;compositing-background = xor
;compositing-background = screen
;compositing-foreground = source
;compositing-base3 = over
;pseudo-transparency = false

;--------------------------------------

[global/wm]
margin-top = 0
margin-bottom = 0

; vim: set syntax=yaml:
