[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.9499999787658453
    capsule_padding = 7.0
    capsule_radius = 3
    capsule_thickness = 0.99999998137354851
    center = [ "control-center", "workspaces", "taskbar" ]
    end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "group:g2" ]
    font_family = "Iosevka Custom"
    font_weight = 600
    layer = "overlay"
    margin_edge = 3
    margin_ends = 4
    padding = 0
    radius = 5
    reserve_space = false
    shadow = false
    start = [ "group:g3", "launcher", "clipboard", "media", "group:g1", "screenshot" ]
    thickness = 26
    widget_spacing = 4

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 0.94999998807907104
        padding = 11.0
        radius = 3.0

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g2"
        members = [ "battery" ]
        opacity = 0.94999998807907104
        padding = 11.0
        radius = 3.0

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g3"
        members = [ "date", "spacer_2", "clock" ]
        opacity = 0.94999998807907104
        padding = 12.0
        radius = 3.0

[control_center]
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1200

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1500

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1220

[location]
address = "Cape Town, South Africa"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 1077.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[nightlight]
enabled = true
temperature_night = 3400

[notification]
layer = "overlay"

[shell]
corner_radius_scale = 0.35000000521540642
font_family = "SF Pro Display"
password_style = "random"
settings_show_advanced = true

    [shell.animation]
    speed = 1.5500000230967999

    [shell.panel]
    borders = false
    clipboard_placement = "floating"
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true

    [shell.shadow]
    alpha = 0.46999998949468136
    direction = "center"

[theme]
builtin = "Nord"

[wallpaper]
directory = "/home/jonty/.cache/wallpaper"

    [wallpaper.default]
    path = "/home/jonty/.cache/wallpaper/current.jpg"

    [wallpaper.last]
    path = "/home/jonty/.cache/wallpaper/current.jpg"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.clock]
color = "on_surface"

[widget.control-center]
glyph = "topology-star"

[widget.cpu]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.spacer_2]
length = 8
type = "spacer"

[widget.taskbar]
inactive_opacity = 0.51000000000000001
only_active_workspace = true
show_active_indicator = false

[widget.temp]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
anchor = true
empty_color = "surface_variant"
labels_only_when_occupied = true
occupied_color = "tertiary"
scale = 1.1000000000000001
